<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Apuntador">
<title>El Apuntador</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Un solo mundo visual: escenario a oscuras, foco dorado para tu papel, terciopelo para la acción */
  --bg:#14101a; --surface:#1e1726; --raise:#291f33; --line:#3a2f46;
  --text:#f4ede6; --muted:#a99db2;
  --gold:#f1b84b; --gold-ink:#2b1b00; --velvet:#d0435c;
  --ok:#5cc58a; --warn:#e9a23b;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* layout: columna única centrada tipo libreto, cabecera fija y barra de pestañas abajo */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:14px 16px 10px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.01em;white-space:nowrap}
.brand em{color:var(--gold)}
.top-play{margin-left:auto;min-width:0;max-width:55%}
.top-play select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:4px 16px 110px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,16,26,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.1}
h1 em,h2 em{color:var(--gold)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:.95rem;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.danger{background:transparent;border-color:var(--velvet);color:var(--velvet)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.big{min-height:56px;font-size:1.05rem;padding:12px 22px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.rec{border-color:var(--velvet);color:#fff;background:var(--velvet)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%}
textarea{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.45}
input[type=range]{accent-color:var(--gold);width:100%}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;border:1px solid var(--line);color:var(--muted)}
.chip.me{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.mid{border-color:var(--warn);color:var(--warn)}
.chip.rec{border-color:var(--velvet);color:var(--velvet)}

/* Inicio */
.hero{padding:18px 0 6px}
.hero p{margin:.4rem 0 0;max-width:46ch}
.play-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px}
.ring text{font-family:var(--f-display);fill:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.list-item .grow{flex:1;min-width:0}

/* Libreto */
.script{display:flex;flex-direction:column;gap:2px}
.it{border-radius:12px;padding:10px 12px;border:1px solid transparent;scroll-margin:120px}
.it.scene{font-family:var(--f-display);font-size:1.2rem;color:var(--gold);padding-top:22px;border-bottom:1px solid var(--line);border-radius:0}
.it.dir{font-style:italic;color:var(--muted);font-size:.92rem;padding-left:24px}
.it.ln{display:grid;grid-template-columns:9rem 1fr;gap:12px;cursor:pointer}
.it.ln:hover{background:var(--surface)}
.who{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px;font-weight:700}
.it.mine{background:linear-gradient(90deg,rgba(241,184,75,.10),transparent 70%);box-shadow:inset 3px 0 0 var(--gold)}
.it.mine .who{color:var(--gold)}
.it.now{background:var(--raise);border-color:var(--gold)}
.it.now.mine.wait{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 3px 0 0 var(--gold),0 0 0 4px rgba(241,184,75,.22)}}
.note{font-style:italic;color:var(--muted)}
.gap{color:var(--gold);letter-spacing:.05em}
.hid{display:inline-block;color:var(--gold);border:1px dashed var(--gold);border-radius:8px;padding:2px 10px;font-size:.88rem}
.ini{color:var(--text)}
.ini i{color:var(--muted);font-style:normal;letter-spacing:.08em}
.recdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--velvet);margin-left:6px;vertical-align:middle}
@media (max-width:560px){
  .it.ln{grid-template-columns:1fr;gap:2px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .play-card{grid-template-columns:1fr;justify-items:start}
  h1{font-size:1.8rem}
}

/* Barra de ensayo */
.runbar{position:sticky;top:62px;z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.runstatus{display:flex;align-items:center;gap:10px;min-height:24px;font-size:.92rem}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;flex:1}
.bar>div{height:100%;width:0;background:var(--gold);transition:width .2s linear}
.yourturn{color:var(--gold);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts .lbl{font-size:.78rem;color:var(--muted);margin-right:-2px}

/* Memorizar */
.flash{display:flex;flex-direction:column;gap:16px}
.cue{border-left:3px solid var(--line);padding:4px 0 4px 14px}
.cue .who{padding:0 0 4px}
.myline{font-size:1.3rem;line-height:1.45;font-family:var(--f-display)}
.myline .hid{font-family:var(--f-body)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}

/* Grabar */
.recrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.recrow:first-child{border-top:0}
.recrow .txt{font-size:.95rem}
.recrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:50;max-width:min(92vw,520px);font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,14,.75);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--gold);border-radius:20px;padding:24px;max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px}
.modal h2{font-size:1.8rem}
details.card summary{cursor:pointer;font-family:var(--f-display);font-size:1.15rem;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;color:var(--gold)}
details.card[open] summary::after{content:"–"}
.castrow{display:grid;grid-template-columns:8.5rem 1fr 7rem auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.castrow{grid-template-columns:1fr 1fr}.castrow .nm{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="top-in">
    <div class="brand">El <em>Apuntador</em></div>
    <div class="top-play" id="topPlay"></div>
  </div></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs"></div></nav>
</div>
<input type="file" id="audioIn" accept="audio/*" capture="user" hidden>
<input type="file" id="docIn" accept=".txt,.md,.pdf,.docx,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="jsonIn" accept=".txt,.json,text/plain,application/json" hidden>
<div id="overlay"></div>

<script>
/* ============ Personalización fija (rellenar para regalarla ya montada) ============ */
const PERSONA_DEFAULT = "";        // p. ej. "Maite"  → saludo personal
const GRUPO_DEFAULT   = "";        // p. ej. "Grupo de teatro Txirimiri"

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const title = s => s.toLowerCase().replace(/(^|[\s\-'])(\S)/g, (m,a,b) => a + b.toUpperCase());
const words = s => (s.trim().match(/\S+/g) || []).length;
const today = () => new Date().toISOString().slice(0,10);
const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============ Parser del libreto ============ */
const UP = "A-ZÁÉÍÓÚÜÑÀÈÌÒÙÇ";
const reScene = /^(ACTO|ESCENA|CUADRO|PR[ÓO]LOGO|EP[ÍI]LOGO|ESCENARIO)\b/i;
const reColon = new RegExp("^([" + UP + "a-záéíóúüñàèìòùç][\\wÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÇç .'\\-]{0,38}?)\\s*(?:\\(([^)]*)\\))?\\s*[:：]\\s*(.*)$");
const reDot   = new RegExp("^([" + UP + "][" + UP + " .'\\-]{1,38}?)\\s*(?:\\(([^)]*)\\))?\\.\\s+(.+)$");
const reAlone = new RegExp("^([" + UP + "][" + UP + " .'\\-]{1,38})\\s*(?:\\(([^)]*)\\))?$");

function isName(s){
  s = s.trim(); const w = s.split(/\s+/);
  if (!s || w.length > 4 || /^https?$/i.test(s)) return false;
  if (s === s.toUpperCase()) return true;
  const small = /^(de|del|la|el|los|las|y)$/;
  return w.length <= 3 && w.every((x, i) => /^[A-ZÁÉÍÓÚÜÑ]/.test(x) || (i > 0 && small.test(x)));
}
function splitNotes(t){
  const notes = []; const spoken = t.replace(/\(([^)]*)\)/g, (m, n) => { notes.push(n.trim()); return " "; }).replace(/\s+/g, " ").trim();
  return { text: spoken, notes };
}
function parse(raw){
  const out = []; let scene = ""; let pending = null; let lastWasLineOf = null;
  const push = (char, note, txt) => {
    const key = char.toUpperCase().replace(/\s+/g, " ").trim();
    const s = splitNotes(txt || "");
    if (note) s.notes.unshift(note.trim());
    out.push({ type: "line", char: key, text: s.text, notes: s.notes, scene });
    lastWasLineOf = key;
  };
  for (let l of raw.replace(/\r/g, "").split("\n")){
    l = l.trim();
    if (!l){ pending = null; lastWasLineOf = null; continue; }
    if (reScene.test(l) && l.length < 90){ scene = l; out.push({ type: "scene", text: l }); pending = null; lastWasLineOf = null; continue; }
    if (/^[\(\[].*[\)\]]$/.test(l)){ out.push({ type: "dir", text: l.slice(1, -1).trim(), scene }); continue; }
    let m = l.match(reColon);
    if (m && isName(m[1])){ if (m[3] || m[2]) push(m[1], m[2], m[3]); pending = m[1]; continue; }
    m = l.match(reDot);
    if (m && words(m[1]) <= 4){ push(m[1], m[2], m[3]); pending = null; continue; }
    m = l.match(reAlone);
    if (m && words(m[1]) <= 4 && l === l.toUpperCase()){ pending = m[1]; if (m[2]) { out.push({ type:"dir", text:m[2], scene }); } lastWasLineOf = null; continue; }
    const last = out[out.length - 1];
    if (pending){
      const key = pending.toUpperCase().replace(/\s+/g, " ").trim();
      if (last && last.type === "line" && last.char === key && lastWasLineOf === key){ const s = splitNotes(l); last.text = (last.text + " " + s.text).trim(); last.notes.push(...s.notes); }
      else push(pending, null, l);
      continue;
    }
    if (last && last.type === "line" && lastWasLineOf){ const s = splitNotes(l); last.text = (last.text + " " + s.text).trim(); last.notes.push(...s.notes); continue; }
    out.push({ type: "dir", text: l, scene });
  }
  const seen = {};
  for (const it of out){ if (it.type !== "line") continue; const b = hash(it.char + "|" + it.text); seen[b] = (seen[b] || 0) + 1; it.key = b + "-" + seen[b]; }
  return out.filter(it => it.type !== "line" || it.text || it.notes.length);
}
function castOf(lines){
  const c = {}; for (const it of lines) if (it.type === "line") c[it.char] = (c[it.char] || 0) + 1;
  return Object.entries(c).sort((a,b) => b[1] - a[1]);
}

/* ============ Guion de ejemplo (original) ============ */
const SAMPLE = `ESCENA 1. Salón de casa de la abuela. Tarde de lluvia.
(Entra LUCÍA con una caja polvorienta entre los brazos.)
LUCÍA: Abuela, mira lo que he encontrado detrás del baúl.
ABUELA ROSARIO: (sin levantar la vista del punto) Si es otra araña, déjala donde estaba.
LUCÍA: Es una llave. Grande, de hierro, con una cinta roja.
ABUELA ROSARIO: (deja las agujas) Esa cinta la até yo. En mil novecientos setenta y dos.
DON ANSELMO: (desde la puerta) ¿Mil novecientos setenta y dos? Rosario, ese año no abriste ni la ventana.
ABUELA ROSARIO: Anselmo, entra y calla, que la lluvia te ha dejado el sombrero como una maceta.
LUCÍA: ¿Y qué abre?
ABUELA ROSARIO: El desván. Y en el desván, lo que tu abuelo no quiso que viera nadie.
DON ANSELMO: Ni yo. Y eso que le presté la escalera.
LUCÍA: Pues ahora lo vamos a ver los tres.
(Pausa. Un trueno.)
ABUELA ROSARIO: Está bien. Pero antes, un café. Las sorpresas, con el estómago lleno.
DON ANSELMO: Por fin una idea sensata en esta casa.

ESCENA 2. El desván. Polvo, baúles y una ventana pequeña.
LUCÍA: Huele a madera vieja y a algo dulce.
ABUELA ROSARIO: A membrillo. Tu abuelo escondía aquí las cartas. Y el membrillo.
DON ANSELMO: (abre un baúl) Aquí hay un sobre con tu nombre, Rosario.
ABUELA ROSARIO: (muy bajo) Léelo tú, Lucía. A mí me tiembla la voz.
LUCÍA: "Si alguien encuentra esta llave, que suba a Rosario el café a la cama. Un día, por lo menos."
DON ANSELMO: Cuarenta años guardando eso. Qué hombre más romántico.
ABUELA ROSARIO: Romántico y tacaño. Ni una joya, ni un duro. Un café.
LUCÍA: Pues mañana te lo subo yo, abuela. Con membrillo.`;

/* ============ Estado ============ */
const LS = "apuntador.v1";
function freshScript(name, raw, me){
  const lines = parse(raw);
  return { id: uid(), title: name, raw, lines, me: me || "", cast: {}, progress: {}, rec: {}, sessions: [], updated: Date.now() };
}
function defaults(){
  const sc = freshScript("La llave del desván (ejemplo)", SAMPLE, "LUCÍA");
  const mine = sc.lines.filter(l => l.type === "line" && l.char === "LUCÍA");
  if (mine[0]) sc.progress[mine[0].key] = 2; if (mine[1]) sc.progress[mine[1].key] = 1;
  return {
    profile: { name: PERSONA_DEFAULT, group: GRUPO_DEFAULT },
    scripts: [sc], current: sc.id,
    settings: { rate: 1, announce: true, announceScenes: true, readDirections: false, pauseMode: "auto", pauseFactor: 1.2, level: "initials", context: "scene", chime: true, memFilter: "all" },
    days: []
  };
}
let S;
try { S = JSON.parse(localStorage.getItem(LS) || "null"); } catch(e){ S = null; }
if (!S || !S.scripts || !S.scripts.length) S = defaults();
S.settings = Object.assign(defaults().settings, S.settings || {});
S.profile = Object.assign({ name: PERSONA_DEFAULT, group: GRUPO_DEFAULT }, S.profile || {});
if (!S.profile.name && PERSONA_DEFAULT) S.profile.name = PERSONA_DEFAULT;
if (!S.profile.group && GRUPO_DEFAULT) S.profile.group = GRUPO_DEFAULT;
S.days = S.days || [];
(function hashName(){ const h = decodeURIComponent((location.hash || "").slice(1)); if (h && /^[\p{L} .'-]{2,30}$/u.test(h)) S.profile.name = h.replace(/[-_]/g, " "); })();
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
const cur = () => S.scripts.find(s => s.id === S.current) || S.scripts[0];
const myLines = sc => sc.lines.filter(l => l.type === "line" && l.char === sc.me);

/* ============ Audio guardado (IndexedDB con respaldo en memoria) ============ */
const memAudio = new Map(); let dbp = null;
function idb(){
  if (dbp) return dbp;
  dbp = new Promise(res => { try { const r = indexedDB.open("apuntador", 1); r.onupgradeneeded = () => r.result.createObjectStore("audio"); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch(e){ res(null); } });
  return dbp;
}
async function audioPut(k, blob){ memAudio.set(k, blob); const db = await idb(); if (!db) return; try { await new Promise((res, rej) => { const tx = db.transaction("audio", "readwrite"); tx.objectStore("audio").put(blob, k); tx.oncomplete = res; tx.onerror = rej; }); } catch(e){} }
async function audioGet(k){ if (memAudio.has(k)) return memAudio.get(k); const db = await idb(); if (!db) return null; return new Promise(res => { try { const r = db.transaction("audio").objectStore("audio").get(k); r.onsuccess = () => { if (r.result) memAudio.set(k, r.result); res(r.result || null); }; r.onerror = () => res(null); } catch(e){ res(null); } }); }
async function audioDel(k){ memAudio.delete(k); const db = await idb(); if (!db) return; try { db.transaction("audio", "readwrite").objectStore("audio").delete(k); } catch(e){} }

/* ============ Voces ============ */
let VOICES = [];
const HAS_TTS = "speechSynthesis" in window;
function loadVoices(){ if (!HAS_TTS) return; const all = speechSynthesis.getVoices(); const es = all.filter(v => /^es/i.test(v.lang)); VOICES = es.length ? es : all; }
if (HAS_TTS){ loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); if (view === "ajustes") render(); }; }
const PITCHES = [1, 0.78, 1.28, 0.92, 1.15, 0.68, 1.4];
function charIdx(sc, ch){ return Math.max(0, castOf(sc.lines).findIndex(c => c[0] === ch)); }
function voiceCfg(sc, ch){
  const cfg = sc.cast[ch] || {}; const i = charIdx(sc, ch);
  let v = VOICES.find(x => x.voiceURI === cfg.voice);
  if (!v && VOICES.length) v = VOICES[i % VOICES.length];

function narrator(){ const v = VOICES.find(x => x.voiceURI === S.settings.narrator) || VOICES[0]; return { voice: v, pitch: 1, rate: Math.min(1.25, S.settings.rate * 1.05) }; }

let currentAudio = null;

    a.onended = fin; a.onpause = fin; a.onerror = fin;

async function playLine(sc, it){

let actx = null;

}

/* ============ Motor de lectura / ensayo ============ */
const RUN = { token: 0, mode: null, idx: -1, waiting: false, revealed: new Set(), active: false };
let advanceResolver = null, barTimer = null;
function waitAdvance(ms){
  return new Promise(res => {
    let t;
    const done = () => { clearTimeout(t); advanceResolver = null; stopBar(); res(); };
    advanceResolver = done;
    if (ms){ t = setTimeout(done, ms); startBar(ms); }
  });
}
function advance(){ if (advanceResolver) advanceResolver(); else if (HAS_TTS && speechSynthesis.speaking) speechSynthesis.cancel(); else if (currentAudio) currentAudio.pause(); }
function startBar(ms){ const b = $("#tbar"); if (!b) return; const t0 = Date.now(); stopBar(); barTimer = setInterval(() => { const el = $("#tbar"); if (el) el.style.width = Math.min(100, (Date.now() - t0) / ms * 100) + "%"; }, 120); }
function stopBar(){ clearInterval(barTimer); const el = $("#tbar"); if (el) el.style.width = "0"; }
function stopAll(){
  RUN.token++; RUN.active = false; RUN.waiting = false; RUN.idx = -1;
  if (HAS_TTS) speechSynthesis.cancel(); if (currentAudio) currentAudio.pause();
  if (advanceResolver) advanceResolver();
  document.querySelectorAll(".it.now").forEach(e => e.classList.remove("now", "wait"));
  updateRunUI();
}
function estimate(text){ return Math.round((words(text) * 420 / S.settings.rate) * S.settings.pauseFactor + 900); }
function nextLineIdx(L, i){ for (let j = i + 1; j < L.length; j++) if (L[j].type === "line") return j; return -1; }
function highlight(i){
  document.querySelectorAll(".it.now").forEach(e => e.classList.remove("now", "wait"));
  const el = document.querySelector('.it[data-i="' + i + '"]');
  if (el){ el.classList.add("now"); if (RUN.waiting) el.classList.add("wait"); el.scrollIntoView({ block: "center", behavior: REDUCED ? "auto" : "smooth" }); }
}
async function runFrom(start, mode){
  if (!HAS_TTS && mode) toast("Este navegador no puede leer en voz alta. Usa audios grabados o prueba con Chrome o Safari.");
  stopAll();
  const my = ++RUN.token; const sc = cur(); const L = sc.lines;
  RUN.mode = mode; RUN.active = true; RUN.revealed = new Set(); let said = 0;
  if (mode === "rehearse" && !sc.me){ RUN.active = false; toast("Elige primero tu personaje."); go("ajustes"); return; }
  render();
  for (let i = start; i < L.length; i++){
    if (my !== RUN.token) return;
    const it = L[i]; RUN.idx = i; RUN.waiting = false;
    if (it.type === "scene"){ highlight(i); updateRunUI(); if (S.settings.announceScenes) await say(it.text, narrator()); else await sleep(400); continue; }
    if (it.type === "dir"){ if (S.settings.readDirections){ highlight(i); updateRunUI(); await say(it.text, narrator()); } continue; }
    const mine = mode === "rehearse" && it.char === sc.me;
    if (mode === "rehearse" && S.settings.context === "cue" && !mine){ const n = nextLineIdx(L, i); if (n < 0 || L[n].char !== sc.me) continue; }
    if (!mine){
      highlight(i); updateRunUI();
      if (S.settings.announce && (mode === "listen" || mode === "rehearse")) { await say(title(it.char), narrator()); if (my !== RUN.token) return; }
      await playLine(sc, it); if (my !== RUN.token) return;
      await sleep(250); continue;
    }
    RUN.waiting = true; highlight(i); updateRunUI();
    if (S.settings.chime) chime();
    await waitAdvance(S.settings.pauseMode === "auto" ? estimate(it.text) : 0);
    if (my !== RUN.token) return;
    RUN.waiting = false; RUN.revealed.add(i); said++;
    const el = document.querySelector('.it[data-i="' + i + '"] .tx'); if (el) el.innerHTML = fullText(it);
    if (S.settings.level !== "full") await sleep(1100);
  }
  if (my === RUN.token){ RUN.active = false; RUN.idx = -1; document.querySelectorAll(".it.now").forEach(e => e.classList.remove("now", "wait")); updateRunUI(); finish(mode, said); }
}
function finish(mode, said){
  const sc = cur();
  if (mode === "rehearse"){
    if (!S.days.includes(today())) S.days.push(today());
    sc.sessions.push({ d: Date.now(), n: said }); save();
    const name = S.profile.name ? ", " + esc(S.profile.name) : "";
    modal(`<h2>¡Bravo${name}!</h2><p class="muted">Has dado vida a ${said} ${said === 1 ? "réplica" : "réplicas"} de ${esc(title(sc.me))}. Llevas ${streak()} ${streak() === 1 ? "día" : "días"} seguidos ensayando.</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-a="again">Otra vez</button><button class="btn" data-a="closeModal">Cerrar</button></div>`);
  }
}
function streak(){
  const set = new Set(S.days); let n = 0; const d = new Date();
  if (!set.has(d.toISOString().slice(0,10))) d.setDate(d.getDate() - 1);
  while (set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ============ Máscaras de memorización ============ */
const LETTER = /[A-Za-zÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÇç]/;
function maskText(text, level){
  if (level === "full") return esc(text);
  const parts = text.split(/(\s+)/);
  if (level === "initials") return '<span class="ini">' + parts.map(w => {
    if (!w || /^\s+$/.test(w)) return w;
    const k = [...w].findIndex(c => LETTER.test(c)); if (k < 0) return esc(w);
    const arr = [...w]; return esc(arr.slice(0, k + 1).join("")) + "<i>" + arr.slice(k + 1).map(c => LETTER.test(c) ? "·" : esc(c)).join("") + "</i>";
  }).join("") + "</span>";
  if (level === "gaps"){ let n = 0; return parts.map(w => { if (!w || /^\s+$/.test(w)) return w; n++; return n % 3 === 0 ? '<span class="gap">' + "_".repeat(Math.max(3, Math.min(10, w.length))) + "</span>" : esc(w); }).join(""); }
  return '<span class="hid">Tu réplica · ' + words(text) + " palabras</span>";
}
function notesHTML(it){ return it.notes && it.notes.length ? '<span class="note">(' + it.notes.map(esc).join(") (") + ")</span> " : ""; }
function fullText(it){ return notesHTML(it) + esc(it.text); }

/* ============ Importación de documentos ============ */
function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector('script[src="' + src + '"]')) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el lector")); document.head.appendChild(s); }); }
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(buf){
  await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js");
  const lib = window["pdfjs-dist/build/pdf"]; lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise; let out = "";
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p); const tc = await page.getTextContent(); let lastY = null, line = "";
    for (const it of tc.items){ const y = it.transform ? it.transform[5] : lastY; if (lastY !== null && Math.abs(y - lastY) > 2){ out += line.trimEnd() + "\n"; line = ""; } line += it.str; if (it.hasEOL){ out += line.trimEnd() + "\n"; line = ""; lastY = null; continue; } lastY = y; }
    out += line.trimEnd() + "\n\n";
  }
  return out.replace(/\n{3,}/g, "\n\n");
}
async function docxText(buf){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); const r = await window.mammoth.extractRawText({ arrayBuffer: buf }); return r.value; }
async function readDoc(file){
  const st = $("#docStatus"); if (st) st.textContent = "Leyendo " + file.name + "…";
  try {
    let txt; const n = file.name.toLowerCase();
    if (n.endsWith(".pdf")) txt = await pdfText(await file.arrayBuffer());
    else if (n.endsWith(".docx")) txt = await docxText(await file.arrayBuffer());
    else txt = await file.text();
    draft.raw = txt.trim(); if (!draft.title) draft.title = file.name.replace(/\.[^.]+$/, "");
    render(); toast("Texto cargado. Revísalo antes de crear el guion.");
  } catch(e){ if (st) st.textContent = ""; toast("No he podido leer ese archivo. Copia el texto y pégalo en el cuadro."); }
}

/* ============ Grabación ============ */
async function recToggle(key){
  if (recState){ const same = recState.key === key; recState.mr.stop(); if (same) return; await sleep(150); }
  if (HAS_TTS) speechSynthesis.cancel(); if (currentAudio) currentAudio.pause();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const mr = new MediaRecorder(stream); const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); recState = null; if (blob.size > 800){ takes.set(key, blob); playBlob(blob); } render(); };
    mr.start(); recState = { key, mr }; render();
  } catch(e){ micBlocked = true; recState = null; render(); toast("No hay acceso al micrófono. Revisa el permiso del navegador o usa «Grabar con el móvil»."); }
}
async function saveTake(sc, key){
  const b = takes.get(key); if (!b) return;
  await audioPut(sc.id + ":" + key, b); sc.rec[key] = 1; takes.delete(key); save();
}
const blobToB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1] || ""); fr.onerror = () => r(""); fr.readAsDataURL(b); });
function b64ToBlob(d, mime){ const bin = atob(d); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime || "audio/webm" }); }
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9|]+/g, " ").trim();
async function exportVoices(sc, f){
  const rows = sc.lines.filter(l => l.type === "line" && sc.rec[l.key] && (!f || l.char === f));
  if (!rows.length){ toast("Todavía no hay voces grabadas" + (f ? " de " + title(f) : "") + "."); return; }
  const items = [];
  for (const l of rows){ const b = await audioGet(sc.id + ":" + l.key); if (b) items.push({ key: l.key, char: l.char, text: l.text, mime: b.type || "audio/webm", data: await blobToB64(b) }); }
  const name = ("Voces " + (f ? title(f) : "del grupo") + " - " + sc.title).replace(/[\\/:*?"<>|]/g, "") + ".apuntador.txt";
  const file = new File([JSON.stringify({ apuntador: 1, kind: "voces", title: sc.title, char: f || "", items })], name, { type: "text/plain" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: name }); return; } } catch(e){ if (e && e.name === "AbortError") return; }
  if (IN_FRAME){ toast("Desde esta ventana no se pueden enviar archivos. Hazlo desde la dirección web propia de El Apuntador."); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast("Paquete guardado en Descargas. Envíalo por WhatsApp o correo.");
}
async function importAny(text){
  let d; try { d = JSON.parse(text); } catch(e){ toast("Ese archivo no es de El Apuntador."); return; }
  if (d && d.raw) return importJson(text);
  if (!d || d.kind !== "voces" || !Array.isArray(d.items)){ toast("Ese archivo no es de El Apuntador."); return; }
  const sc = cur(); const byKey = new Map(), byText = new Map();
  for (const l of sc.lines) if (l.type === "line"){ byKey.set(l.key, l); const t = norm(l.char + "|" + l.text); if (!byText.has(t)) byText.set(t, l); }
  let ok = 0, miss = 0;
  for (const it of d.items){ const l = byKey.get(it.key) || byText.get(norm(it.char + "|" + it.text)); if (!l || !it.data){ miss++; continue; } await audioPut(sc.id + ":" + l.key, b64ToBlob(it.data, it.mime)); sc.rec[l.key] = 1; ok++; }
  save(); render();
  toast(ok + (ok === 1 ? " voz cargada" : " voces cargadas") + (miss ? ". " + miss + " no encajan con este guion: puede que tengáis versiones distintas." : "."));
}

/* ============ Eventos ============ */
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); if (g){ if (g.dataset.go === "nuevo") draft = { title: "", raw: "" }; go(g.dataset.go); return; }
  const sg = e.target.closest("[data-seg]");
  if (sg){ let v = sg.dataset.v; if (v === "true") v = true; else if (v === "false") v = false; S.settings[sg.dataset.seg] = v; if (sg.dataset.seg === "memFilter") memIdx = 0; save(); render(); return; }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a; const sc = cur();
  switch (a){
    case "closeModalBg": if (e.target === el) closeModal(); break;
    case "closeModal": closeModal(); break;
    case "again": closeModal(); runFrom(0, "rehearse"); break;
    case "goRehearse": go("ensayo"); break;
    case "goRehearseHidden": S.settings.level = "hidden"; save(); go("ensayo"); break;
    case "listenAll": view = "guion"; render(); runFrom(0, "listen"); break;
    case "startListen": runFrom(0, "listen"); break;
    case "startRehearse": runFrom(0, "rehearse"); break;
    case "listenHere": runFrom(Math.max(0, lastTap), "listen"); break;
    case "rehearseHere": runFrom(Math.max(0, lastTap), "rehearse"); break;
    case "advance": advance(); break;
    case "stop": stopAll(); render(); break;
    case "back": { const L = sc.lines; let j = RUN.idx - 1; while (j > 0 && L[j].type !== "line") j--; runFrom(Math.max(0, j), RUN.mode); break; }
    case "lineTap": {
      const i = +el.dataset.i; lastTap = i;
      if (RUN.active) { runFrom(i, RUN.mode); break; }
      document.querySelectorAll(".it.now").forEach(x => x.classList.remove("now")); el.classList.add("now"); updateRunUI();
      const it = sc.lines[i]; if (view === "guion" || it.char !== sc.me) { if (HAS_TTS) speechSynthesis.cancel(); if (currentAudio) currentAudio.pause(); playLine(sc, it); }
      break; }
    case "saveName": { const v = $("#nameIn").value.trim(); if (v){ S.profile.name = v; save(); render(); } break; }
    case "useScript": S.current = el.dataset.id; save(); memIdx = 0; render(); break;
    case "memShow": memShow = true; render(); break;
    case "memRate": { const list = memList(sc); const it = list[memIdx]; sc.progress[it.key] = +el.dataset.v; if (!S.days.includes(today())) S.days.push(today()); save(); memShow = false;
      if (S.settings.memFilter === "pending" && +el.dataset.v === 2) {} else memIdx = (memIdx + 1) % Math.max(1, memList(sc).length);
      render(); break; }
    case "memPrev": memIdx = Math.max(0, memIdx - 1); memShow = false; render(); break;
    case "memNext": memIdx = (memIdx + 1) % Math.max(1, memList(sc).length); memShow = false; render(); break;
    case "playCue": { const it = memList(sc)[memIdx]; const i = sc.lines.indexOf(it); for (let j = i - 1; j >= 0; j--) if (sc.lines[j].type === "line"){ playLine(sc, sc.lines[j]); break; } break; }
    case "playMine": playLine(sc, memList(sc)[memIdx]); break;
    case "recToggle": recToggle(el.dataset.k); break;
    case "upload": pendingUploadKey = el.dataset.k; $("#audioIn").value = ""; $("#audioIn").click(); break;
    case "recPlay": { const b = await audioGet(sc.id + ":" + el.dataset.k); if (b) playBlob(b); else toast("Ese audio ya no está en este dispositivo."); break; }
    case "recDel": await audioDel(sc.id + ":" + el.dataset.k); delete sc.rec[el.dataset.k]; save(); render(); break;
    case "takePlay": { const b = takes.get(el.dataset.k); if (b){ if (currentAudio) currentAudio.pause(); playBlob(b); } break; }
    case "takeDrop": takes.delete(el.dataset.k); render(); break;
    case "takeSave": {
      await saveTake(sc, el.dataset.k); toast("Guardada. El ensayo ya usa esta voz.");
      if (el.closest("#guide")){ const { rows } = recRows(sc); const n = rows.findIndex((x, j) => j > guideIdx && !sc.rec[x.it.key]); if (n >= 0) guideIdx = n; else if (guideIdx < rows.length - 1) guideIdx++; }
      render(); break; }
    case "guidePrev": guideIdx = Math.max(0, guideIdx - 1); render(); break;
    case "guideNext": guideIdx++; render(); break;
    case "guideCue": if (HAS_TTS) speechSynthesis.cancel(); if (currentAudio) currentAudio.pause(); playLine(sc, sc.lines[+el.dataset.i]); break;
    case "exportVoices": exportVoices(sc, recRows(sc).f); break;
    case "importVoices": $("#jsonIn").value = ""; $("#jsonIn").click(); break;
    case "ttsPlay": playLine(sc, sc.lines[+el.dataset.i]); break;
    case "testVoice": { const c = el.dataset.c; const it = sc.lines.find(l => l.type === "line" && l.char === c && !sc.rec[l.key]) || { text: "Hola, soy " + title(c) }; if (HAS_TTS) speechSynthesis.cancel(); say(it.text, voiceCfg(sc, c)); break; }
    case "saveProfile": S.profile.name = $("#pName").value.trim(); S.profile.group = $("#pGroup").value.trim(); save(); toast("Guardado."); render(); break;
    case "saveRaw": {
      const raw = $("#scRaw").value; const t = $("#scTitle").value.trim() || sc.title;
      const lines = parse(raw); const keys = new Set(lines.filter(l => l.type === "line").map(l => l.key));
      for (const k of Object.keys(sc.progress)) if (!keys.has(k)) delete sc.progress[k];
      for (const k of Object.keys(sc.rec)) if (!keys.has(k)){ delete sc.rec[k]; audioDel(sc.id + ":" + k); }
      sc.raw = raw; sc.lines = lines; sc.title = t; sc.updated = Date.now();
      if (sc.me && !lines.some(l => l.char === sc.me)) sc.me = "";
      save(); toast("Guion actualizado: " + lines.filter(l => l.type === "line").length + " réplicas."); render(); break; }
    case "copyJson": { const data = JSON.stringify({ apuntador: 1, title: sc.title, raw: sc.raw, me: sc.me, cast: sc.cast, progress: sc.progress }); try { await navigator.clipboard.writeText(data); toast("Copiado. Pégalo en un mensaje o en otro dispositivo."); } catch(err){ $("#jsonPaste").value = data; $("#jsonPaste").select(); toast("No he podido copiar solo. El texto está seleccionado abajo: cópialo tú."); } break; }
    case "dlJson": { const data = JSON.stringify({ apuntador: 1, title: sc.title, raw: sc.raw, me: sc.me, cast: sc.cast, progress: sc.progress }, null, 1); const aEl = document.createElement("a"); aEl.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); aEl.download = sc.title.replace(/[^\wáéíóúñ\- ]/gi, "") + ".apuntador.json"; aEl.click(); break; }
    case "loadJson": $("#jsonIn").value = ""; $("#jsonIn").click(); break;
    case "pasteJson": importAny($("#jsonPaste").value); break;
    case "delScript": modal(`<h2>¿Borrar el guion?</h2><p class="muted">Se borran «${esc(sc.title)}», su progreso y sus audios de este dispositivo.</p><div class="row" style="justify-content:center"><button class="btn danger" data-a="delConfirm">Borrar</button><button class="btn" data-a="closeModal">Cancelar</button></div>`); break;
    case "delConfirm": { for (const k of Object.keys(sc.rec)) audioDel(sc.id + ":" + k); S.scripts = S.scripts.filter(s => s.id !== sc.id); if (!S.scripts.length){ const d = defaults(); S.scripts = d.scripts; } S.current = S.scripts[0].id; save(); closeModal(); go("inicio"); break; }
    case "pickDoc": $("#docIn").value = ""; $("#docIn").click(); break;
    case "createScript": {
      draft.title = $("#nTitle").value.trim() || "Obra sin título"; draft.raw = $("#nRaw").value;
      const me = $("#nMe") ? $("#nMe").value : "";
      const s = freshScript(draft.title, draft.raw, me); S.scripts.unshift(s); S.current = s.id; save(); draft = { title: "", raw: "" };
      toast("Guion creado." + (me ? "" : " Elige tu personaje en Inicio.")); go("inicio"); break; }
  }
});
function importJson(txt){
  try { const d = JSON.parse(txt); if (!d || !d.raw) throw 0; const s = freshScript(d.title || "Obra", d.raw, d.me || ""); s.cast = d.cast || {}; s.progress = d.progress || {}; S.scripts.unshift(s); S.current = s.id; save(); toast("Guion cargado."); go("inicio"); }
  catch(e){ toast("Esa copia no es válida. Asegúrate de pegarla entera."); }
}
document.addEventListener("change", async e => {
  const t = e.target; const sc = cur();
  if (t.id === "pickPlay"){ stopAll(); S.current = t.value; memIdx = 0; save(); render(); }
  else if (t.id === "meSel"){ sc.me = t.value; memIdx = 0; save(); render(); }
  else if (t.id === "recFilter"){ recFilter = t.value; guideIdx = 0; render(); }
  else if (t.dataset.cast === "voice"){ sc.cast[t.dataset.c] = Object.assign(sc.cast[t.dataset.c] || {}, { voice: t.value || undefined }); save(); }
  else if (t.dataset.cast === "pitch"){ sc.cast[t.dataset.c] = Object.assign(sc.cast[t.dataset.c] || {}, { pitch: +t.value }); save(); render(); }
  else if (t.id === "rateIn"){ S.settings.rate = +t.value; save(); render(); }
  else if (t.id === "pfIn"){ S.settings.pauseFactor = +t.value; save(); render(); }
  else if (t.id === "narrSel"){ S.settings.narrator = t.value; save(); }
  else if (t.id === "audioIn" && t.files[0] && pendingUploadKey){ takes.set(pendingUploadKey, t.files[0]); pendingUploadKey = null; render(); toast("Escucha la toma y pulsa Guardar si te gusta."); }
  else if (t.id === "docIn" && t.files[0]){ draft.title = ($("#nTitle") || {}).value || draft.title; readDoc(t.files[0]); }
  else if (t.id === "jsonIn" && t.files[0]){ importAny(await t.files[0].text()); }
});
let prevT;
document.addEventListener("input", e => {
  if (e.target.id === "nRaw" || e.target.id === "nTitle"){
    draft.raw = $("#nRaw").value; draft.title = $("#nTitle").value;
    clearTimeout(prevT); prevT = setTimeout(() => { const lines = parse(draft.raw); const p = $("#nPreview"); if (p) p.innerHTML = previewHTML(lines, castOf(lines)); const b = document.querySelector('[data-a="createScript"]'); if (b) b.disabled = !castOf(lines).length; }, 250);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.code === "Space" && RUN.active){ e.preventDefault(); advance(); }
  if (e.key === "Enter" && e.target.matches(".it.ln")) e.target.click();
  if (e.key === "Escape"){ if ($("#overlay").innerHTML) closeModal(); else if (RUN.active){ stopAll(); render(); } }
});
render();
</script>
</body>
</html>
