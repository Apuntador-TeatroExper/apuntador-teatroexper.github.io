<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apuntador">
<title>El Apuntador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  /* Un solo mundo visual: escenario a oscuras, foco dorado para tu papel, terciopelo para dirección y bucles */
  --bg:#14101a; --surface:#1e1726; --raise:#291f33; --line:#3a2f46;
  --text:#f4ede6; --muted:#a99db2;
  --gold:#f1b84b; --gold-ink:#2b1b00; --velvet:#d0435c;
  --ok:#5cc58a; --warn:#e9a23b;
  --f-display:"DM Serif Display", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  /* layout: columna única centrada tipo libreto, cabecera fija y barra de pestañas abajo */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 70%,transparent);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.01em;white-space:nowrap}
.brand em{color:var(--gold)}
.top-play{margin-left:auto;min-width:0;max-width:58%}
.top-play select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.9rem}
main{flex:1;width:100%;max-width:760px;margin:0 auto;padding:4px 16px 120px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(20,16,26,.96);border-top:1px solid var(--line);backdrop-filter:blur(8px);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.tab{background:none;border:0;padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--gold)}
.tab[disabled]{opacity:.35;cursor:not-allowed}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:2.1rem;line-height:1.1}
h1 em,h2 em{color:var(--gold)}
h2{font-size:1.45rem}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:700;font-size:.95rem;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.danger{background:transparent;border-color:var(--velvet);color:var(--velvet)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.big{min-height:56px;font-size:1.05rem;padding:12px 22px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.rec{border-color:var(--velvet);color:#fff;background:var(--velvet)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:center;font-size:.92rem}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%}
textarea{min-height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;line-height:1.45}
textarea.prose{font-family:var(--f-body);font-size:.95rem;min-height:90px}
input[type=range]{accent-color:var(--gold);width:100%}
input[type=checkbox]{accent-color:var(--gold);width:20px;height:20px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;cursor:pointer;font-size:.86rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--gold)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.me{border-color:var(--gold);color:var(--gold)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.mid{border-color:var(--warn);color:var(--warn)}
.chip.rec,.chip.loop{border-color:var(--velvet);color:var(--velvet)}

/* Inicio */
.hero{padding:18px 0 6px}
.hero p{margin:.4rem 0 0;max-width:46ch}
.countdown{display:inline-flex;align-items:baseline;gap:8px;margin-top:10px;border:1px solid var(--gold);border-radius:999px;padding:4px 14px;color:var(--gold)}
.countdown b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;font-variant-numeric:tabular-nums}
.play-card{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:108px;height:108px}
.ring text{font-family:var(--f-display);fill:var(--text)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-item:first-of-type{border-top:0}
.list-item .grow{flex:1;min-width:0}
.sub{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}

/* Libreto */
.script{display:flex;flex-direction:column;gap:2px}
.it{border-radius:12px;padding:10px 12px;border:1px solid transparent;border-right-width:3px;scroll-margin:140px}
.it.scene{font-family:var(--f-display);font-size:1.2rem;color:var(--gold);padding-top:22px;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer}
.it.dir{font-style:italic;color:var(--muted);font-size:.92rem;padding-left:24px}
.it.ln{display:grid;grid-template-columns:9rem 1fr;gap:12px;cursor:pointer}
.it.ln:hover{background:var(--surface)}
.who{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px;font-weight:700}
.who small{display:block;text-transform:none;letter-spacing:0;font-weight:400;font-size:.75rem}
.it.mine{background:linear-gradient(90deg,rgba(241,184,75,.10),transparent 70%);box-shadow:inset 3px 0 0 var(--gold)}
.it.mine .who{color:var(--gold)}
.it.inloop{border-right-color:var(--velvet)}
.it.now{background:var(--raise);border-color:var(--gold)}
.it.now.inloop{border-right-color:var(--velvet)}
.it.now.mine.wait{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 3px 0 0 var(--gold),0 0 0 4px rgba(241,184,75,.22)}}
.note{font-style:italic;color:var(--muted)}
.gap{color:var(--gold);letter-spacing:.05em}
.hid{display:inline-block;color:var(--gold);border:1px dashed var(--gold);border-radius:8px;padding:2px 10px;font-size:.88rem}
.ini i{color:var(--muted);font-style:normal;letter-spacing:.08em}
mark.miss{background:rgba(208,67,92,.22);color:#ffb3c0;border-radius:4px;padding:0 2px;text-decoration:underline wavy var(--velvet)}
.recdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--velvet);margin-left:6px;vertical-align:middle}
.anns{grid-column:2;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.ann{font-size:.85rem;color:var(--muted);border-left:2px solid var(--line);padding:2px 0 2px 10px;text-align:left}
.ann b{font-weight:700;color:var(--text);font-size:.78rem;letter-spacing:.03em}
.ann.dir{border-left-color:var(--velvet)}
.ann.dir b{color:var(--velvet)}
.ann.mineN{border-left-color:var(--gold)}
@media (max-width:560px){
  .it.ln{grid-template-columns:1fr;gap:2px}
  .anns{grid-column:1}
  .stats{grid-template-columns:repeat(2,1fr)}
  .play-card{grid-template-columns:1fr;justify-items:start}
  h1{font-size:1.8rem}
}

/* Barra de ensayo */
.runbar{position:sticky;top:calc(62px + env(safe-area-inset-top,0px));z-index:10;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;max-height:70vh;overflow:auto}
.runstatus{display:flex;align-items:center;gap:10px;min-height:24px;font-size:.92rem;flex-wrap:wrap}
.bar{height:6px;background:var(--bg);border-radius:6px;overflow:hidden;flex:1;min-width:80px}
.bar>div{height:100%;width:0;background:var(--gold);transition:width .2s linear}
.yourturn{color:var(--gold);font-weight:700}
.live{flex-basis:100%;font-size:.85rem;color:var(--muted);font-style:italic;min-height:1.2em}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opts .lbl{font-size:.78rem;color:var(--muted);margin-right:-2px}
.opts select{width:auto;max-width:100%;padding:6px 10px;font-size:.86rem}
details.more summary{cursor:pointer;font-size:.86rem;color:var(--muted);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"– "}
details.more[open]{display:flex;flex-direction:column;gap:10px}

/* Memorizar */
.flash{display:flex;flex-direction:column;gap:16px}
.cue{border-left:3px solid var(--line);padding:4px 0 4px 14px}
.cue .who{padding:0 0 4px}
.myline{font-size:1.3rem;line-height:1.45;font-family:var(--f-display)}
.myline .hid{font-family:var(--f-body)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}

/* Grabar */
.recrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.recrow .txt{font-size:.95rem}
.recrow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold);border-radius:12px;padding:10px 16px;z-index:70;max-width:min(92vw,520px);font-size:.92rem;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.modal-bg{position:fixed;inset:0;background:rgba(10,8,14,.78);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border:1px solid var(--gold);border-radius:20px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
.modal.center{text-align:center}
.modal h2{font-size:1.7rem}
details.card summary{cursor:pointer;font-family:var(--f-display);font-size:1.15rem;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";float:right;color:var(--gold)}
details.card[open] summary::after{content:"–"}
.castrow{display:grid;grid-template-columns:9rem 1fr 7rem auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:560px){.castrow{grid-template-columns:1fr 1fr}.castrow .nm{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div class="top-in">
    <div class="brand">El <em>Apuntador</em></div>
    <div class="top-play" id="topPlay"></div>
  </div></header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Secciones"><div class="tabs-in" id="tabs"></div></nav>
</div>
<input type="file" id="audioIn" accept="audio/*" capture="user" hidden>
<input type="file" id="docIn" accept=".txt,.md,.pdf,.docx,text/plain,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
<input type="file" id="jsonIn" accept=".txt,.json,text/plain,application/json" hidden>
<div id="overlay"></div>

<script>
/* ============ Personalización fija (opcional) ============ */
const PERSONA_DEFAULT = "";
const GRUPO_DEFAULT   = "";

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Math.random().toString(36).slice(2, 10);
function hash(s){ let h = 2166136261; for (const c of s){ h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
const title = s => String(s).toLowerCase().replace(/(^|[\s\-'(])(\S)/g, (m,a,b) => a + b.toUpperCase());
const sentence = s => s === s.toUpperCase() ? s.charAt(0) + s.slice(1).toLowerCase() : s;
const words = s => (String(s).trim().match(/\S+/g) || []).length;
const dayStr = d => { const x = new Date(d); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
const today = () => dayStr(new Date());
const fmtDate = s => { try { return new Date(s + "T12:00:00").toLocaleDateString("es-ES", { day: "numeric", month: "long", year: "numeric" }); } catch(e){ return s; } };
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9ñ|]+/g, " ").trim();
const IN_FRAME = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();
const REDUCED = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const isGroup = ch => /^(TOD[AOE]S|TODOS LOS PERSONAJES|TODAS LAS ACTRICES|TODO EL MUNDO|CORO)$/.test(ch);

/* ============ Lector del libreto ============ */
const UP = "A-ZÁÉÍÓÚÜÑÀÈÌÒÙÇ";
const reScene = /^(ACTO|ESCENA|CUADRO|PR[ÓO]LOGO|EP[ÍI]LOGO)\b/i;
const reSpeaker = new RegExp("^([" + UP + "a-záéíóúüñàèìòùç][\\wÁÉÍÓÚÜÑáéíóúüñÀÈÌÒÙàèìòùÇç .'\\-]{0,38}?)\\s*(?:\\(([^)]*)\\))?\\s*(?:,\\s*([^:：()]{1,90}?))?\\s*[:：]\\s*(.*)$");
const reDot   = new RegExp("^([" + UP + "][" + UP + " .'\\-]{1,38}?)\\s*(?:\\(([^)]*)\\))?\\.\\s+(.+)$");
const reAlone = new RegExp("^([" + UP + "][" + UP + " .'\\-]{1,38})\\s*(?:\\(([^)]*)\\))?$");
const keyOf = s => s.toUpperCase().replace(/\s+/g, " ").trim();
function personLike(s){ const w = s.trim().split(/\s+/); return !!s.trim() && w.length <= 3 && w.every(x => /^[A-ZÁÉÍÓÚÜÑ][a-záéíóúüñ]+$/.test(x)); }
function isName(s, strict){
  s = s.trim(); const w = s.split(/\s+/);
  if (!s || w.length > 4 || /^https?$/i.test(s)) return false;
  if (s === s.toUpperCase() && /[A-ZÁÉÍÓÚÑ]/.test(s)) return true;
  if (strict) return false;
  const small = /^(de|del|la|el|los|las|y)$/;
  return w.length <= 3 && w.every((x, i) => /^[A-ZÁÉÍÓÚÜÑ]/.test(x) || (i > 0 && small.test(x)));
}
function splitNotes(t){
  const notes = []; const spoken = String(t).replace(/\(([^)]*)\)/g, (m, n) => { notes.push(n.trim()); return " "; }).replace(/\s+/g, " ").trim();
  return { text: spoken, notes };
}
function parse(raw){
  const out = []; const meta = { title: "", subtitle: "", roster: {}, preamble: [] };
  const rawLines = String(raw).replace(/\r/g, "").split("\n").map(l => l.trim().replace(/^[-•·*–]\s+/, ""));
  const hasScenes = rawLines.some(l => reScene.test(l) && l.length < 90);
  const upperSpeakers = rawLines.filter(l => { const m = l.match(reSpeaker); return m && m[1] === m[1].toUpperCase() && /[A-Z]/.test(m[1]) && words(m[1]) <= 4; }).length;
  const strict = upperSpeakers >= 3;
  let inPre = hasScenes, scene = "", pending = null, lastOf = null;
  const push = (char, actor, qual, note, txt) => {
    const key = keyOf(char); const s = splitNotes(txt || "");
    if (note) s.notes.unshift(note.trim());
    if (qual){ let q = qual.trim().toLowerCase(); q = q.replace(/^como\s+([^\s,]+)/, (m, a) => "como " + title(a)); s.notes.unshift(q); }
    if (actor && !meta.roster[key]) meta.roster[key] = { actor, desc: "" };
    out.push({ type: "line", char: key, text: s.text, notes: s.notes, scene }); lastOf = key;
  };
  for (const l of rawLines){
    if (!l){ pending = null; lastOf = null; continue; }
    if (reScene.test(l) && l.length < 90){ inPre = false; scene = l; out.push({ type: "scene", text: l }); pending = null; lastOf = null; continue; }
    if (inPre){
      const m = l.match(reSpeaker);
      if (m && isName(m[1], true) && m[2] !== undefined){ meta.roster[keyOf(m[1])] = { actor: (m[2] || "").trim(), desc: (m[4] || "").replace(/\.$/, "").trim() }; continue; }
      if (/^reparto$/i.test(l)) continue;
      if (!meta.title) meta.title = l;
      else if (!meta.subtitle && l.length < 120 && !/:/.test(l)) meta.subtitle = l;
      else meta.preamble.push(l);
      continue;
    }
    if (/^[\(\[].*[\)\]]$/.test(l)){ out.push({ type: "dir", text: l.slice(1, -1).trim(), scene }); continue; }
    let m = l.match(reSpeaker);
    if (m && isName(m[1], strict)){
      let actor = "", note = null; const par = (m[2] || "").trim();
      if (par){ const r = meta.roster[keyOf(m[1])]; if ((r && r.actor === par) || personLike(par)) actor = par; else note = par; }
      if (m[4] || note || m[3]) push(m[1], actor, m[3], note, m[4]); else if (actor && !meta.roster[keyOf(m[1])]) meta.roster[keyOf(m[1])] = { actor, desc: "" };
      pending = m[1]; continue;
    }
    m = l.match(reDot);
    if (m && words(m[1]) <= 4){ push(m[1], "", "", m[2], m[3]); pending = null; continue; }
    m = l.match(reAlone);
    if (m && words(m[1]) <= 4 && l === l.toUpperCase()){ pending = m[1]; if (m[2]) out.push({ type: "dir", text: m[2], scene }); lastOf = null; continue; }
    const last = out[out.length - 1];
    if (pending){
      const key = keyOf(pending);
      if (last && last.type === "line" && last.char === key && lastOf === key){ const s = splitNotes(l); last.text = (last.text + " " + s.text).trim(); last.notes.push(...s.notes); }
      else push(pending, "", "", null, l);
      continue;
    }
    if (last && last.type === "line" && lastOf){ const s = splitNotes(l); last.text = (last.text + " " + s.text).trim(); last.notes.push(...s.notes); continue; }
    out.push({ type: "dir", text: l, scene });
  }
  const seen = {};
  for (const it of out){ if (it.type !== "line") continue; const b = hash(it.char + "|" + it.text); seen[b] = (seen[b] || 0) + 1; it.key = b + "-" + seen[b]; }
  const lines = out.filter(it => it.type !== "line" || it.text || it.notes.length);
  if (meta.title) meta.title = sentence(meta.title);
  return { lines, meta };
}
function castOf(lines){
  const c = {}; for (const it of lines) if (it.type === "line") c[it.char] = (c[it.char] || 0) + 1;
  return Object.entries(c).sort((a,b) => (isGroup(a[0]) - isGroup(b[0])) || b[1] - a[1]);
}

/* ============ Estado ============ */
const LS = "apuntador.v1";
function freshScript(name, raw, me){
  const p = parse(raw);
  return { id: uid(), title: name || p.meta.title || "Obra sin título", raw, lines: p.lines, meta: p.meta, me: me || "", cast: {}, progress: {}, rec: {}, notes: {}, scores: {}, sessions: [], status: "ensayo", premiere: "", version: "Borrador", loop: null, created: Date.now(), updated: Date.now() };
}

  if (f && !cast.some(c => c[0] === f)) f = "";
  return { f, cast, rows: sc.lines.map((it, i) => ({ it, i })).filter(x => x.it.type === "line" && (!f || x.it.char === f)) };
}
function takeActions(sc, it, i, big){
  const k = it.key, has = !!sc.rec[k], take = takes.has(k), isRec = recState && recState.key === k, sz = big ? "" : " sm";
  if (isRec) return `<button class="btn${sz} rec" data-a="recToggle" data-k="${k}">■ Parar</button><span class="small" style="color:var(--velvet)">Grabando… di la réplica</span>`;
  if (take) return `<button class="btn${sz}" data-a="takePlay" data-k="${k}">▶ Escuchar toma</button><button class="btn${sz} primary" data-a="takeSave" data-k="${k}">Guardar</button><button class="btn${sz} ghost" data-a="${micBlocked ? "upload" : "recToggle"}" data-k="${k}">Repetir</button><button class="btn${sz} ghost" data-a="takeDrop" data-k="${k}">Descartar</button>`;
  return `${!micBlocked ? `<button class="btn${sz} ${big ? "primary" : ""}" data-a="recToggle" data-k="${k}">● ${has ? "Regrabar" : "Grabar"}</button>` : ""}
    <button class="btn${sz} ${micBlocked && big ? "primary" : "ghost"}" data-a="upload" data-k="${k}">${micBlocked ? "Grabar con el móvil" : "Subir audio"}</button>
    ${has ? `<button class="btn${sz}" data-a="recPlay" data-k="${k}">▶ Oír</button><button class="btn${sz} ghost" data-a="recDel" data-k="${k}">Borrar</button>` : `<button class="btn${sz} ghost" data-a="ttsPlay" data-i="${i}">Voz app</button>`}`;
}
function guideHTML(sc, rows){
  if (!rows.length) return "";

  const { it, i } = rows[guideIdx];
  let cue = null; for (let j = i - 1; j >= 0; j--){ if (sc.lines[j].type === "line"){ cue = sc.lines[j]; break; } if (sc.lines[j].type === "scene") break; }
  return `<section class="card flash" id="guide">
    <div class="row small muted" style="justify-content:space-between"><span>Grabación guiada · ${esc((it.scene || "").split(/[.:]/)[0])}</span><span>${guideIdx + 1} de ${rows.length}${sc.rec[it.key] ? ' · <span style="color:var(--ok)">ya tiene voz</span>' : ""}</span></div>
    ${cue ? `<div class="cue"><div class="who">${esc(title(cue.char))} da el pie</div><div>${fullText(cue)}</div><button class="btn sm ghost" data-a="guideCue" data-i="${sc.lines.indexOf(cue)}" style="margin-top:8px">Oír el pie</button></div>` : `<div class="cue muted">Abre la escena.</div>`}
    <div><div class="who" style="color:var(--gold)">${esc(title(it.char))}</div><div class="myline">${fullText(it)}</div>${annHTML(sc, it).replace('class="anns"', 'class="anns" style="grid-column:auto"')}</div>
    <div class="row">${takeActions(sc, it, i, true)}</div>
    <div class="row" style="justify-content:space-between"><button class="btn sm ghost" data-a="guidePrev" ${guideIdx === 0 ? "disabled" : ""}>Anterior</button><button class="btn sm ghost" data-a="guideNext">Siguiente</button></div>

}

/* ============ Importación de documentos ============ */
function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector('script[src="' + src + '"]')) return res(); const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar el lector")); document.head.appendChild(s); }); }
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
async function pdfText(buf){
  await loadScript(PDFJS + "pdf.min.js"); await loadScript(PDFJS + "pdf.worker.min.js");
  const lib = window["pdfjs-dist/build/pdf"]; lib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js";
  const pdf = await lib.getDocument({ data: buf, isEvalSupported: false }).promise; let out = "";
  for (let p = 1; p <= pdf.numPages; p++){
    const page = await pdf.getPage(p); const tc = await page.getTextContent(); let lastY = null, line = "";
    for (const it of tc.items){ const y = it.transform ? it.transform[5] : lastY; if (lastY !== null && Math.abs(y - lastY) > 2){ out += line.trimEnd() + "\n"; line = ""; } line += it.str; if (it.hasEOL){ out += line.trimEnd() + "\n"; line = ""; lastY = null; continue; } lastY = y; }
    out += line.trimEnd() + "\n\n";
  }
  return out.replace(/\n{3,}/g, "\n\n");
}
async function docxText(buf){ await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"); const r = await window.mammoth.extractRawText({ arrayBuffer: buf }); return r.value; }
async function readDoc(file){
  const st = $("#docStatus"); if (st) st.textContent = "Leyendo " + file.name + "…";
  try {
    let txt; const n = file.name.toLowerCase();
    if (n.endsWith(".pdf")) txt = await pdfText(await file.arrayBuffer());
    else if (n.endsWith(".docx")) txt = await docxText(await file.arrayBuffer());
    else txt = await file.text();
    draft.raw = txt.trim(); draft.title = "";
    render(); toast("Texto cargado. Revísalo antes de crear el guion.");
  } catch(e){ if (st) st.textContent = ""; toast("No he podido leer ese archivo. Copia el texto y pégalo en el cuadro."); }
}

/* ============ Grabación de voces ============ */
async function recToggle(key){
  if (recState){ const same = recState.key === key; recState.mr.stop(); if (same) return; await sleep(150); }
  hush();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    const mr = new MediaRecorder(stream); const chunks = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = () => { stream.getTracks().forEach(t => t.stop()); const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); recState = null; if (blob.size > 800){ takes.set(key, blob); playBlob(blob); } render(); };
    mr.start(); recState = { key, mr }; render();
  } catch(e){ micBlocked = true; recState = null; render(); toast("No hay acceso al micrófono. Revisa el permiso del navegador o usa «Grabar con el móvil»."); }
}
async function saveTake(sc, key){ const b = takes.get(key); if (!b) return; await audioPut(sc.id + ":" + key, b); sc.rec[key] = 1; takes.delete(key); save(); }

/* ============ Compartir: guion, voces y notas ============ */
const blobToB64 = b => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1] || ""); fr.onerror = () => r(""); fr.readAsDataURL(b); });
function b64ToBlob(d, mime){ const bin = atob(d); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Blob([u], { type: mime || "audio/webm" }); }
function notesExport(sc){ const out = []; for (const l of sc.lines) if (l.type === "line") for (const n of notesFor(sc, l.key)) out.push({ key: l.key, char: l.char, text: l.text, n }); return out; }
async function shareFile(name, text, fallbackToTextarea){
  const file = new File([text], name.replace(/[\\/:*?"<>|]/g, ""), { type: "text/plain" });
  try { if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: name }); return true; } } catch(e){ if (e && e.name === "AbortError") return true; }
  if (!IN_FRAME){ const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); toast("Archivo guardado en Descargas. Envíalo por WhatsApp o correo."); return true; }
  if (fallbackToTextarea){ try { await navigator.clipboard.writeText(text); toast("Copiado. Pégalo en un mensaje."); return true; } catch(e){} }
  toast("Desde esta ventana no se pueden enviar archivos. Hazlo desde la dirección web propia de El Apuntador."); return false;
}
function scriptPack(sc){ return JSON.stringify({ apuntador: 2, kind: "guion", title: sc.title, raw: sc.raw, version: sc.version, premiere: sc.premiere, cast: sc.cast, notes: notesExport(sc) }); }
async function exportVoices(sc, f){
  const rows = sc.lines.filter(l => l.type === "line" && sc.rec[l.key] && (!f || l.char === f));
  const notes = notesExport(sc);
  if (!rows.length && !notes.length){ toast("Todavía no hay voces" + (f ? " de " + title(f) : "") + " ni notas que enviar."); return; }
  const items = [];
  for (const l of rows){ const b = await audioGet(sc.id + ":" + l.key); if (b) items.push({ key: l.key, char: l.char, text: l.text, mime: b.type || "audio/webm", data: await blobToB64(b) }); }
  const who = S.profile.name || (f ? title(f) : "del grupo");
  await shareFile("Voces y notas de " + who + " - " + sc.title + ".apuntador.txt", JSON.stringify({ apuntador: 2, kind: "voces", title: sc.title, char: f || "", by: S.profile.name || "", items, notes }));
}
function matcher(sc){
  const byKey = new Map(), byText = new Map();
  for (const l of sc.lines) if (l.type === "line"){ byKey.set(l.key, l); const t = norm(l.char + "|" + l.text); if (!byText.has(t)) byText.set(t, l); }
  return x => byKey.get(x.key) || byText.get(norm(x.char + "|" + x.text)) || null;
}
function mergeNotes(sc, list){
  const find = matcher(sc); let ok = 0;
  for (const x of list || []){ const l = find(x); if (!l || !x.n || !x.n.id) continue; const arr = sc.notes[l.key] = sc.notes[l.key] || []; if (!arr.some(n => n.id === x.n.id)){ arr.push(x.n); ok++; } }
  for (const k in sc.notes) sc.notes[k].sort((a, b) => (b.dir - a.dir) || (a.ts - b.ts));
  return ok;
}
let pendingImport = null;
async function importAny(text){
  let d; try { d = JSON.parse(text); } catch(e){ toast("Ese archivo no es de El Apuntador."); return; }
  if (d && d.raw) return importScript(d);
  if (!d || d.kind !== "voces" || !Array.isArray(d.items)){ toast("Ese archivo no es de El Apuntador."); return; }
  let sc = cur(); const t = S.scripts.find(s => norm(s.title) === norm(d.title || "")); if (t) sc = t;
  if (!sc){ toast("Primero carga el guion de la obra."); return; }
  const find = matcher(sc); let ok = 0, miss = 0;
  for (const it of d.items){ const l = find(it); if (!l || !it.data){ miss++; continue; } await audioPut(sc.id + ":" + l.key, b64ToBlob(it.data, it.mime)); sc.rec[l.key] = 1; ok++; }
  const nn = mergeNotes(sc, d.notes);
  S.current = sc.id; save(); render();
  toast(`${ok} ${ok === 1 ? "voz" : "voces"} y ${nn} ${nn === 1 ? "nota nueva" : "notas nuevas"} en «${sc.title}»` + (miss ? `. ${miss} réplicas no encajan con tu versión del guion.` : "."));
}
function importScript(d){
  const ex = S.scripts.find(s => norm(s.title) === norm(d.title || ""));
  if (ex){ pendingImport = d; modal(`<h2>Ya tienes «${esc(ex.title)}»</h2><p class="muted">¿Es una versión nueva del mismo guion?</p><p class="small muted">Si la actualizas se conservan tus voces, notas y progreso en todas las réplicas que no cambian.</p><div class="row"><button class="btn primary" data-a="impUpdate">Actualizar la mía</button><button class="btn" data-a="impNew">Guardarla como otra obra</button><button class="btn ghost" data-a="closeModal">Cancelar</button></div>`); return; }
  addImported(d);
}
function addImported(d){
  const s = freshScript(d.title || "", d.raw, d.me || ""); s.cast = d.cast || {}; s.version = d.version || "Borrador"; s.premiere = d.premiere || "";
  if (d.progress) s.progress = d.progress;
  if (Array.isArray(d.notes)) mergeNotes(s, d.notes); else if (d.notes && typeof d.notes === "object") s.notes = d.notes;
  S.scripts.unshift(s); S.current = s.id; save(); toast("Guion cargado: " + s.title + ". Elige tu personaje."); go("inicio");
}
function updateRaw(sc, raw){
  const p = parse(raw); const keys = new Set(p.lines.filter(l => l.type === "line").map(l => l.key));
  for (const k of Object.keys(sc.progress)) if (!keys.has(k)) delete sc.progress[k];
  for (const k of Object.keys(sc.scores)) if (!keys.has(k)) delete sc.scores[k];
  for (const k of Object.keys(sc.notes)) if (!keys.has(k)) delete sc.notes[k];
  for (const k of Object.keys(sc.rec)) if (!keys.has(k)){ delete sc.rec[k]; audioDel(sc.id + ":" + k); }
  sc.raw = raw; sc.lines = p.lines; sc.meta = p.meta; sc.updated = Date.now(); sc.loop = null;
  if (sc.me && !p.lines.some(l => l.char === sc.me)) sc.me = "";
  return p.lines.filter(l => l.type === "line").length;
}

/* ============ Eventos ============ */
document.addEventListener("click", async e => {
  const g = e.target.closest("[data-go]"); if (g){ if (g.disabled) return; if (g.dataset.go === "nuevo") draft = { title: "", raw: "" }; go(g.dataset.go); return; }
  const sg = e.target.closest("[data-seg]");
  if (sg){ let v = sg.dataset.v; if (v === "true") v = true; else if (v === "false") v = false; S.settings[sg.dataset.seg] = v; if (sg.dataset.seg === "memFilter") memIdx = 0; if (sg.dataset.seg === "pauseMode") srBroken = false; save(); render(); return; }
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a; const sc = cur();
  switch (a){
    case "closeModalBg": if (e.target === el) closeModal(); break;
    case "closeModal": closeModal(); break;
    case "again": closeModal(); runFrom(sc.loop && sc.loop.on ? sc.loop.a : 0, "rehearse"); break;
    case "replay": closeModal(); if (lastSession){ if (view !== "ensayo"){ view = "ensayo"; render(); } runFrom(lastSession.a, "replay", { end: lastSession.b, clips: lastSession.clips }); } break;
    case "install": if (installEvt){ installEvt.prompt(); installEvt = null; render(); } break;
    case "goRehearse": go("ensayo"); break;
    case "goRehearseHidden": S.settings.level = "hidden"; save(); go("ensayo"); break;
    case "listenAll": view = "guion"; render(); runFrom(0, "listen"); break;
    case "startListen": runFrom(sc.loop && sc.loop.on ? sc.loop.a : 0, "listen"); break;
    case "startRehearse": runFrom(sc.loop && sc.loop.on ? sc.loop.a : 0, "rehearse"); break;
    case "listenHere": runFrom(Math.max(0, lastTap), "listen"); break;
    case "rehearseHere": runFrom(Math.max(0, lastTap), "rehearse"); break;
    case "advance": advance(); break;
    case "stop": stopAll(); render(); break;
    case "back": { const L = sc.lines; let j = RUN.idx - 1; while (j > 0 && L[j].type !== "line") j--; runFrom(Math.max(0, j), RUN.mode); break; }
    case "lineTap": {
      const i = +el.dataset.i; const it = sc.lines[i];
      if (RUN.pick){
        if (RUN.pick === "a"){ RUN.pickA = i; RUN.pick = "b"; updateRunUI(); }
        else { const x = Math.min(RUN.pickA, i), y = Math.max(RUN.pickA, i); sc.loop = { a: x, b: y, on: true }; RUN.pick = null; save(); render(); toast("Bucle listo: " + loopLabel(sc) + "."); }
        break;
      }
      lastTap = i;
      if (RUN.active){ runFrom(i, RUN.mode === "replay" ? "rehearse" : RUN.mode); break; }
      document.querySelectorAll(".it.now").forEach(x => x.classList.remove("now")); el.classList.add("now"); updateRunUI();
      if (it.type !== "line") break;
      if (view === "guion" && S.settings.tapMode === "note"){ noteModal(i); break; }
      if (view === "guion" || !isMine(sc, it)){ hush(); playLine(sc, it); }
      break; }
    case "loopScene": { const [x, y] = sceneBounds(sc, lastTap >= 0 ? lastTap : 0); sc.loop = { a: x, b: y, on: true }; save(); render(); toast("En bucle: " + loopLabel(sc) + ". Pulsa el botón dorado para empezar."); break; }
    case "loopPick": RUN.pick = "a"; updateRunUI(); break;
    case "loopCancel": RUN.pick = null; updateRunUI(); break;
    case "loopOff": sc.loop = null; save(); render(); break;
    case "saveName": { const v = $("#nameIn").value.trim(); if (v){ S.profile.name = v; save(); render(); } break; }
    case "useScript": stopAll(); S.current = el.dataset.id; save(); memIdx = 0; lastTap = -1; go("inicio"); break;
    case "memShow": memShow = true; render(); break;
    case "memNote": noteModal(sc.lines.indexOf(memList(sc)[memIdx])); break;
    case "memRate": { const list = memList(sc); const it = list[memIdx]; sc.progress[it.key] = +el.dataset.v; if (!S.days.includes(today())) S.days.push(today()); save(); memShow = false;
      if (!(S.settings.memFilter === "pending" && +el.dataset.v === 2)) memIdx = (memIdx + 1) % Math.max(1, memList(sc).length);
      render(); break; }
    case "memPrev": memIdx = Math.max(0, memIdx - 1); memShow = false; render(); break;
    case "memNext": memIdx = (memIdx + 1) % Math.max(1, memList(sc).length); memShow = false; render(); break;
    case "playCue": { const it = memList(sc)[memIdx]; const i = sc.lines.indexOf(it); for (let j = i - 1; j >= 0; j--) if (sc.lines[j].type === "line"){ hush(); playLine(sc, sc.lines[j]); break; } break; }
    case "playMine": hush(); playLine(sc, memList(sc)[memIdx]); break;
    case "noteSave": {
      const i = +el.dataset.i; const it = sc.lines[i]; const t = ($("#noteTxt").value || "").trim(); if (!t){ toast("Escribe la nota primero."); break; }
      if (!S.profile.name){ const by = ($("#noteBy") || {}).value; if (by && by.trim()) S.profile.name = by.trim(); }
      const arr = sc.notes[it.key] = sc.notes[it.key] || []; arr.push({ id: uid() + uid(), by: S.profile.name || "", dir: !!S.profile.dir, text: t, ts: Date.now() });
      arr.sort((x, y) => (y.dir - x.dir) || (x.ts - y.ts)); save(); closeModal(); render(); toast("Nota guardada."); break; }
    case "noteDel": { const it = sc.lines[+el.dataset.i]; sc.notes[it.key] = notesFor(sc, it.key).filter(n => n.id !== el.dataset.id); if (!sc.notes[it.key].length) delete sc.notes[it.key]; save(); noteModal(+el.dataset.i); render(); break; }
    case "recToggle": recToggle(el.dataset.k); break;
    case "upload": pendingUploadKey = el.dataset.k; $("#audioIn").value = ""; $("#audioIn").click(); break;
    case "recPlay": { const b = await audioGet(sc.id + ":" + el.dataset.k); if (b){ hush(); playBlob(b); } else toast("Ese audio ya no está en este dispositivo."); break; }
    case "recDel": await audioDel(sc.id + ":" + el.dataset.k); delete sc.rec[el.dataset.k]; save(); render(); break;
    case "takePlay": { const b = takes.get(el.dataset.k); if (b){ hush(); playBlob(b); } break; }
    case "takeDrop": takes.delete(el.dataset.k); render(); break;
    case "takeSave": {
      await saveTake(sc, el.dataset.k); toast("Guardada. El ensayo ya usa esta voz.");
      if (el.closest("#guide")){ const { rows } = recRows(sc); const n = rows.findIndex((x, j) => j > guideIdx && !sc.rec[x.it.key]); if (n >= 0) guideIdx = n; else if (guideIdx < rows.length - 1) guideIdx++; }
      render(); break; }
    case "guidePrev": guideIdx = Math.max(0, guideIdx - 1); render(); break;
    case "guideNext": guideIdx++; render(); break;
    case "guideCue": hush(); playLine(sc, sc.lines[+el.dataset.i]); break;
    case "exportVoices": exportVoices(sc, recRows(sc).f); break;
    case "ttsPlay": hush(); playLine(sc, sc.lines[+el.dataset.i]); break;
    case "testVoice": { const c = el.dataset.c; const it = sc.lines.find(l => l.type === "line" && l.char === c) || { text: "Hola, soy " + title(c) }; hush(); say(it.text, voiceCfg(sc, c)); break; }
    case "saveProfile": S.profile.name = $("#pName").value.trim(); S.profile.group = $("#pGroup").value.trim(); S.profile.dir = $("#pDir").checked; save(); toast("Guardado."); render(); break;
    case "saveObra": {
      sc.title = $("#scTitle").value.trim() || sc.title; sc.version = $("#scVersion").value; sc.premiere = $("#scPremiere").value; const was = sc.status; sc.status = $("#scStatus").value; save();
      toast(sc.status === "estrenada" && was !== "estrenada" ? "¡Enhorabuena! La obra pasa al historial." : "Guardado."); render(); break; }
    case "saveRaw": { const n = updateRaw(sc, $("#scRaw").value); save(); toast("Guion actualizado: " + n + " réplicas."); render(); break; }
    case "shareScript": shareFile("Guion - " + sc.title + ".apuntador.txt", scriptPack(sc), true); break;
    case "loadJson": $("#jsonIn").value = ""; $("#jsonIn").click(); break;
    case "pasteJson": importAny($("#jsonPaste").value); break;
    case "impUpdate": { const d = pendingImport; pendingImport = null; closeModal(); if (!d) break; const ex = S.scripts.find(s => norm(s.title) === norm(d.title || "")); const n = updateRaw(ex, d.raw); if (d.version) ex.version = d.version; if (d.premiere) ex.premiere = d.premiere; for (const c in d.cast || {}) if (!ex.cast[c]) ex.cast[c] = d.cast[c]; if (Array.isArray(d.notes)) mergeNotes(ex, d.notes); S.current = ex.id; save(); toast("«" + ex.title + "» actualizada: " + n + " réplicas."); go("inicio"); break; }
    case "impNew": { const d = pendingImport; pendingImport = null; closeModal(); if (d){ d.title = (d.title || "Obra") + " (" + fmtDate(today()) + ")"; addImported(d); } break; }
    case "delScript": modal(`<h2>¿Borrar la obra?</h2><p class="muted">Se borran «${esc(sc.title)}», sus voces, notas y progreso de este dispositivo. Si solo ha terminado, mejor márcala como estrenada para que quede en el historial.</p><div class="row" style="justify-content:center"><button class="btn danger" data-a="delConfirm">Borrar</button><button class="btn" data-a="closeModal">Cancelar</button></div>`, true); break;
    case "delConfirm": { for (const k of Object.keys(sc.rec)) audioDel(sc.id + ":" + k); S.scripts = S.scripts.filter(s => s.id !== sc.id); S.current = S.scripts[0] ? S.scripts[0].id : null; save(); closeModal(); go("inicio"); break; }
    case "pickDoc": $("#docIn").value = ""; $("#docIn").click(); break;
    case "createScript": {
      draft.title = $("#nTitle").value.trim(); draft.raw = $("#nRaw").value;
      const me = $("#nMe") ? $("#nMe").value : "";
      const s = freshScript(draft.title, draft.raw, me); S.scripts.unshift(s); S.current = s.id; save(); draft = { title: "", raw: "" };
      toast("Guion creado." + (me ? "" : " Elige tu personaje en Inicio.")); go("inicio"); break; }
  }
});
document.addEventListener("change", async e => {
  const t = e.target; const sc = cur();
  if (t.id === "pickPlay"){ stopAll(); S.current = t.value; memIdx = 0; lastTap = -1; save(); render(); }
  else if (t.id === "meSel"){ sc.me = t.value; memIdx = 0; save(); render(); }
  else if (t.id === "recFilter"){ recFilter = t.value; guideIdx = 0; render(); }
  else if (t.id === "sceneSel" && t.value !== ""){ lastTap = +t.value; const el = document.querySelector('.it[data-i="' + t.value + '"]'); if (el) el.scrollIntoView({ block: "start", behavior: REDUCED ? "auto" : "smooth" }); updateRunUI(); }
  else if (t.dataset.cast === "voice"){ sc.cast[t.dataset.c] = Object.assign(sc.cast[t.dataset.c] || {}, { voice: t.value || undefined }); save(); }
  else if (t.dataset.cast === "pitch"){ sc.cast[t.dataset.c] = Object.assign(sc.cast[t.dataset.c] || {}, { pitch: +t.value }); save(); render(); }
  else if (t.id === "rateIn"){ S.settings.rate = +t.value; save(); render(); }
  else if (t.id === "pfIn"){ S.settings.pauseFactor = +t.value; save(); render(); }
  else if (t.id === "narrSel"){ S.settings.narrator = t.value; save(); }
  else if (t.id === "audioIn" && t.files[0] && pendingUploadKey){ takes.set(pendingUploadKey, t.files[0]); pendingUploadKey = null; render(); toast("Escucha la toma y pulsa Guardar si te gusta."); }
  else if (t.id === "docIn" && t.files[0]){ readDoc(t.files[0]); }
  else if (t.id === "jsonIn" && t.files[0]){ importAny(await t.files[0].text()); }
});
let prevT;
document.addEventListener("input", e => {
  if (e.target.id === "nRaw" || e.target.id === "nTitle"){
    draft.raw = $("#nRaw").value; draft.title = $("#nTitle").value;
    clearTimeout(prevT); prevT = setTimeout(() => { const p = parse(draft.raw); const el = $("#nPreview"); if (el) el.innerHTML = previewHTML(p, castOf(p.lines)); const b = document.querySelector('[data-a="createScript"]'); if (b) b.disabled = !castOf(p.lines).length; }, 250);
  }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input,textarea,select")) return;
  if (e.code === "Space" && RUN.active){ e.preventDefault(); advance(); }
  if (e.key === "Enter" && e.target.matches(".it.ln")) e.target.click();
  if (e.key === "Escape"){ if ($("#overlay").innerHTML) closeModal(); else if (RUN.active){ stopAll(); render(); } }
});
if (!IN_FRAME && "serviceWorker" in navigator && location.protocol === "https:"){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
save();
render();
</script>
